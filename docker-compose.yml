name: sentinel-sec

services:
  webgoat:
    image: webgoat/webgoat:v2025.3
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/WebGoat/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks:
      - sentinel-net

  gateway:
    build:
      context: ./infra/docker/gateway
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      - SENTINEL_GATEWAY_API_KEY=${SENTINEL_GATEWAY_API_KEY:?missing SENTINEL_GATEWAY_API_KEY in .env}
    depends_on:
      webgoat:
        condition: service_healthy
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
