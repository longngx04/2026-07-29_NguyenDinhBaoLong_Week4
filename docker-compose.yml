name: sentinel-sec

services:
  scanner:
    profiles: ["scan"]
    build:
      context: ./infra/docker/scanner
    image: sentinel-sec/scanner:local
    working_dir: /workspace
    entrypoint: []
    volumes:
      - ./benchmarks/targets/webgoat:/workspace/benchmarks/targets/webgoat:ro
      - ./configs/opengrep:/workspace/configs/opengrep:ro
      - ./artifacts:/workspace/artifacts

  webgoat:
    profiles: ["target"]
    image: webgoat/webgoat:v2025.3
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/WebGoat/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks:
      - sentinel-net

  gateway:
    profiles: ["target"]
    build:
      context: ./infra/docker/gateway
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      - SENTINEL_GATEWAY_API_KEY=${SENTINEL_GATEWAY_API_KEY}
    depends_on:
      webgoat:
        condition: service_healthy
    networks:
      - sentinel-net

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SENTINEL_GATEWAY_API_KEY=${SENTINEL_GATEWAY_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SENTINEL_DEMO_RUN=${SENTINEL_DEMO_RUN:-}
    volumes:
      - ./artifacts:/app/artifacts
      - ./benchmarks:/app/benchmarks:ro
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
