name: Project Sentinel CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and WebGoat submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run static scan without Gateway credentials
        env:
          SENTINEL_GATEWAY_API_KEY: ''
        run: make scan

      - name: Validate raw report format
        run: |
          jq -e 'type == "object" and (.results | type == "array") and (.errors | type == "array")' artifacts/raw/opengrep.json

      - name: Run offline agent tests
        run: make agent-test

      - name: Run mock analysis pipeline
        run: make analyze-mock

      - name: Validate analysis output JSONL schema
        run: make validate-analysis

      - name: Upload raw scan report
        uses: actions/upload-artifact@v4
        with:
          name: raw-scan-reports
          if-no-files-found: error
          path: artifacts/raw/opengrep.json
