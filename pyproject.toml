[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sentinel"
version = "0.1.0"
description = "Security finding normalization and AI-assisted analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[project.scripts]
project-sentinel = "project_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: integration-level tests; some require real local services",
    "live_gateway: opt-in tests requiring the local Docker Gateway and WebGoat",
    "llm: live tests requiring real LLM API key and network tokens",
]
