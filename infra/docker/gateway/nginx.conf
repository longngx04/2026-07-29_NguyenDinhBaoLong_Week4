map_hash_bucket_size 128;
limit_req_zone $http_x_sentinel_api_key zone=sentinel_rl:10m rate=30r/m;
limit_req_zone $http_x_sentinel_dast_key zone=sentinel_dast_rl:10m rate=120r/m;

log_format sentinel_access
  '$time_iso8601 method=$request_method path=$uri status=$status '
  'bytes=$body_bytes_sent rt=$request_time';

log_format sentinel_dast_access
  '$time_iso8601 channel=dast method=$request_method path=$uri status=$status '
  'bytes=$body_bytes_sent rt=$request_time';

access_log off;
